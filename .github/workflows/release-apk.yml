name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning, for example v2.4.0." >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((RUN_NUMBER + 4))" >> "$GITHUB_OUTPUT"

      - name: Install stable Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Add the repository secret ANDROID_DEBUG_KEYSTORE_BASE64 before creating a release tag." >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Run unit tests and build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PappVersionName='${{ steps.version.outputs.name }}' \
            -PappVersionCode='${{ steps.version.outputs.code }}' \
            testReleaseUnitTest assembleRelease

      - name: Prepare APK and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-files
          apk="release-files/clear-tv-islamic-${RELEASE_TAG}.apk"
          cp launcher/app/build/outputs/apk/release/app-release.apk "$apk"
          (cd release-files && sha256sum "$(basename "$apk")" > SHA256SUMS)
          test "$(wc -c < "$apk")" -lt 1258291 || {
            echo "APK is over 1.2 MB; review bundled assets." >&2
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Clear TV Islamic ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/clear-tv-islamic-${{ github.ref_name }}.apk
            release-files/SHA256SUMS
